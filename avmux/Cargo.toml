[package]
name = "avmux"
version = "0.3.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "A crate to merge video and audio based on ffmpeg-next (dynamic link with ffmpeg lib)."

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# `ffmpeg-next` detects the installed FFmpeg version itself (pkg-config, or
# vcpkg on MSVC) and emits the matching `ffmpeg_X_Y` cfgs, so no version or
# linking feature has to be selected here.
ffmpeg-next = { version = "9.0", default-features = false, features = [
    "codec",
    "format",
    "software-resampling",
    "software-scaling",
] }
bon = { version = "3.7" }
thiserror = "2.0"

[features]
default = []

## Build FFmpeg from source instead of linking the system libraries.
build = ["ffmpeg-next/build"]
## Link FFmpeg statically.
static = ["ffmpeg-next/static"]
