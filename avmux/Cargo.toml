[package]
name = "avmux"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "A crate to merge video and audio based on rsmpeg (dynamic link with ffmpeg lib)."

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
rsmpeg = { version = "0.16.1", features = ["link_system_ffmpeg"] }
terrors = { version = "0.3.3" }
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "macros"] }
url = { version = "2.5.4" }
